<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./shared/tokens.css">
<link rel="stylesheet" href="./styles/ui.css">
<link rel="stylesheet" href="./styles/app.css">
<title>Warden</title>
</head>
<body class="wd window">
<svg class="sprite" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M16.4 12.7c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.2.8c1.3 0 2.1-1.2 2.9-2.4.9-1.3 1.3-2.7 1.3-2.7s-2.4-1-2.4-4zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.4-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.5 2.8-1.3z"/></symbol>
    <symbol id="i-win" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><rect x="3" y="3" width="8.5" height="8.5" rx="1"/><rect x="12.5" y="3" width="8.5" height="8.5" rx="1"/><rect x="3" y="12.5" width="8.5" height="8.5" rx="1"/><rect x="12.5" y="12.5" width="8.5" height="8.5" rx="1"/></g></symbol>
</svg>

<main class="panel panel--left" id="content">
  <div class="linked__head">
    <img class="moa" src="/mochi/proud.webp" alt="">
    <div><h1 class="panel__title">This <span data-computer>Mac</span> is linked</h1><p class="row__sub">Your points sync from your phone.</p></div>
  </div>
  <div class="linked__device"><svg class="ico ico--fill" id="device-icon"><use href="#i-apple"/></svg><span class="row__text row__title" id="device-name"></span></div>
  <h2 class="section-label">Browsers</h2>
  <ul class="linked__list" id="browsers"></ul>
  <p class="linked__empty" id="no-browsers" hidden>No browsers found.</p>
  <p class="note"><svg class="ico"><use href="#i-warn"/></svg><span>A browser without the extension drains the whole time it's in front.</span></p>
  <button class="btn btn--block btn--primary" id="done">Done</button>
  <p class="panel__foot">Warden stays in the <span data-tray>menu bar</span>.</p>
</main>

<script type="module" src="./src/linked.ts"></script>
</body>
</html>
