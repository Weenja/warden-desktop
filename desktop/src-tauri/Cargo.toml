[package]
name = "warden-desktop"
version = "0.1.0"
description = "Warden for Mac and Windows: guarded apps drain the points you earn on your phone."
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"

default-run = "warden"

[lib]
name = "warden_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The app. Named like `mainBinaryName` in tauri.conf.json, so the helper finds it by name.
[[bin]]
name = "warden"
path = "src/main.rs"

# The browsers' native messaging host (console program). Tauri bundles every binary of this
# crate next to the app: `Contents/MacOS/` in the .app, the install folder on Windows.
[[bin]]
name = "warden-native-host"
path = "src/bin/warden-native-host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util", "io-std"] }
keyring = "4"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false }

# TLS: rustls on macOS (and Linux). Windows uses the OS TLS stack (SChannel) through native-tls, because
# rustls' crypto providers (aws-lc, ring) need a Windows C toolchain and SChannel follows the system's
# certificate store and policy updates.
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "query"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2", "query"] }
# Win32 for the platform layer (front app, closing apps, Start menu, icons, lock state) and
# window placement. Same major version as Tauri's own, so window handles are the same type.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Uninstall keys for the app picker (read only).
windows-registry = "0.6"
# Encodes app icons as PNG for the picker.
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
tauri-nspanel = "2.1"
# proc_pidinfo / proc_pidpath: the browser link checks which process connected (see platform).
libc = "0.2"
objc2-system-configuration = { version = "0.3", default-features = false, features = ["std", "SCDynamicStore", "SCDynamicStoreCopySpecific"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
